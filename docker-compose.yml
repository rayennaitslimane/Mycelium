services:
  postgres-test:
    image: postgres:16
    container_name: myc-postgres-test

    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: myc_test

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d myc_test"]
      interval: 2s
      timeout: 2s
      retries: 20
